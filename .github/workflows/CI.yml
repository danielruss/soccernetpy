name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.runner }}
    env:
      CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8"
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64
            ort_runtime: linux-x64
          - runner: ubuntu-24.04-arm
            target: aarch64
            ort_runtime: linux-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Test runtime bundling helper
        if: matrix.target == 'x86_64'
        run: python -m unittest discover -s tests -v
      - name: Bundle Microsoft ONNX Runtime from NuGet
        run: python scripts/fetch_onnxruntime.py --runtime "${{ matrix.ort_runtime }}"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
          manylinux: 2_28
      - name: Verify bundled ONNX Runtime
        run: |
          wheel="$(find dist -name '*.whl' -print -quit)"
          unzip -l "$wheel" | grep 'soccernetpy/libonnxruntime.so'
          unzip -l "$wheel" | grep 'soccernetpy/libonnxruntime_providers_shared.so'
      - name: Test inference on glibc 2.28
        run: |
          docker run --rm -i \
            --volume "$PWD/dist:/dist:ro" \
            quay.io/pypa/manylinux_2_28_${{ matrix.target }}:latest \
            bash -se <<'SH'
          /opt/python/cp39-cp39/bin/python -m pip install \
            --no-index --find-links /dist --only-binary=:all: soccernetpy
          /opt/python/cp39-cp39/bin/python - <<'PY'
          import ctypes
          import os
          from pathlib import Path
          from soccernetpy import soccernet

          runtime = Path(os.environ["ORT_DYLIB_PATH"])
          assert runtime.name == "libonnxruntime.so"
          assert runtime.is_file()
          assert runtime.with_name("libonnxruntime_providers_shared.so").is_file()
          ctypes.CDLL(str(runtime))
          result = soccernet(
              job_titles=["soccer player"],
              job_tasks=["play soccer"],
              n=1,
          )
          assert result[0][0].code == "27-2021", result
          print(result[0][0])
          PY
          SH
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            target: x64
            python_arch: x64
            ort_runtime: win-x64
          - runner: windows-11-arm
            target: aarch64
            python_arch: arm64
            ort_runtime: win-arm64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          architecture: ${{ matrix.python_arch }}
      - name: Bundle Microsoft ONNX Runtime from NuGet
        run: python scripts/fetch_onnxruntime.py --runtime "${{ matrix.ort_runtime }}"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test bundled Windows ONNX Runtime
        shell: bash
        run: |
          python -m pip install --no-index --find-links dist --only-binary=:all: soccernetpy
          python - <<'PYTHON'
          import ctypes
          import os
          from pathlib import Path
          from soccernetpy import soccernet

          dll = Path(os.environ["ORT_DYLIB_PATH"])
          assert dll.name == "onnxruntime.dll"
          assert dll.is_file()
          assert dll.with_name("onnxruntime_providers_shared.dll").is_file()
          ctypes.CDLL(str(dll))
          result = soccernet(
              job_titles=["soccer player"],
              job_tasks=["play soccer"],
              n=1,
          )
          assert result[0][0].code == "27-2021", result
          print(result[0][0])
          PYTHON
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-windows-${{ matrix.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64
            ort_runtime: system
          - runner: macos-15-intel
            target: x86_64
            ort_runtime: custom-x86_64
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Bundle custom Intel macOS ONNX Runtime
        if: matrix.ort_runtime == 'custom-x86_64'
        env:
          ORT_VERSION: '1.24.2'
          ORT_SHA256: 57853607712285595b6a60598020ce8d0c2558a4028a24769bd0cb422d007759
        run: |
          archive="$RUNNER_TEMP/onnxruntime-macos-x86_64-${ORT_VERSION}.tar.gz"
          curl --fail --location --retry 3 \
            "https://github.com/danielruss/custom-ort-macos-x86-64/releases/download/v${ORT_VERSION}/onnxruntime-macos-x86_64-${ORT_VERSION}.tar.gz" \
            --output "$archive"
          echo "${ORT_SHA256}  ${archive}" | shasum --algorithm 256 --check
          tar -xzf "$archive" \
            -C python/soccernetpy \
            "libonnxruntime.${ORT_VERSION}.dylib"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }}
      - name: Test Intel macOS wheel
        if: matrix.ort_runtime == 'custom-x86_64'
        run: |
          test "$(uname -m)" = "x86_64"
          wheel="$(find dist -name '*macosx*x86_64.whl' -print -quit)"
          test -n "$wheel"
          unzip -l "$wheel" | grep 'soccernetpy/libonnxruntime.1.24.2.dylib'
          python -m pip install \
            --no-index \
            --find-links dist \
            --only-binary=:all: \
            soccernetpy
          python - <<'PY'
          import os
          from pathlib import Path
          from soccernetpy import soccernet

          dylib = Path(os.environ["ORT_DYLIB_PATH"])
          assert dylib.name == "libonnxruntime.1.24.2.dylib"
          assert dylib.is_file()

          result = soccernet(
              job_titles=["soccer player"],
              job_tasks=["play soccer"],
              n=1,
          )
          assert result[0][0].code == "27-2021", result
          print(result[0][0])
          PY
      - name: Test Apple Silicon macOS wheel
        if: matrix.target == 'aarch64'
        run: |
          test "$(uname -m)" = "arm64"
          python -m pip install \
            --no-index --find-links dist --only-binary=:all: soccernetpy
          python - <<'PY'
          import platform
          from soccernetpy import soccernet

          assert platform.machine() == "arm64", platform.machine()
          result = soccernet(
              job_titles=["soccer player"],
              job_tasks=["play soccer"],
              n=1,
          )
          assert result[0][0].code == "27-2021", result
          print(result[0][0])
          PY
      - name: Upload wheels
        uses: actions/upload-artifact@v6
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v6
        with:
          name: wheels-sdist
          path: dist

  release:
    name: Release
    runs-on: ubuntu-latest
    environment: pypi
    if: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' }}
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'dist/*'

      - name: Install uv
        uses: astral-sh/setup-uv@v8.3.2

      - name: Publish to TestPyPI
        if: ${{ startsWith(github.ref, 'refs/heads/') }}
        run: >-
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          'dist/*'

      - name: Publish to PyPI
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: uv publish 'dist/*'
