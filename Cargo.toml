[package]
name = "soccernetpy"
version = "0.1.4"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "soccernetpy"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.0"
soccer-rs = "0.2.0"

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies.ort]
# Microsoft no longer publishes Intel macOS binaries. CI bundles a custom
# ONNX Runtime dylib in the wheel, and the Python package points ort at it.
version = "=2.0.0-rc.12"
default-features = false
features = ["load-dynamic", "tls-rustls"]

[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies.ort]
# Unifies with soccer-rs's ort dependency so Linux wheels load the Microsoft
# runtime bundled by CI instead of linking pyke's glibc 2.32 static archive.
version = "=2.0.0-rc.12"
default-features = false
features = ["load-dynamic", "tls-rustls"]
